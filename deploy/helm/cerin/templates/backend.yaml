{{- $name := printf "%s-backend" (include "cerin.fullname" .) }}
{{- $secret := include "cerin.secretName" . }}
{{- $storageUrl := include "cerin.storageUrl" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "cerin.labels" . | nindent 4 }}
    {{- include "cerin.selectorLabels" (list . "backend") | nindent 4 }}
spec:
  selector:
    {{- include "cerin.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "cerin.labels" . | nindent 4 }}
    {{- include "cerin.selectorLabels" (list . "backend") | nindent 4 }}
spec:
  # Without Redis the backend keeps its state in memory, so never run two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cerin.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cerin.labels" . | nindent 8 }}
        {{- include "cerin.selectorLabels" (list . "backend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: MONGO_PASSWORD
            - name: MONGODB_URI
              value: mongodb://cerin:$(MONGO_PASSWORD)@{{ include "cerin.mongoHost" . }}:27017/cerin?authSource=admin&replicaSet=rs0&directConnection=true
            - name: MONGODB_DB
              value: cerin
            - name: CERIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: CERIN_JWT_SECRET
            - name: OPENAB_RUNTIME_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: RUNTIME_TOKEN_ENCRYPTION_KEY
            - name: CERIN_AUTH_BASE_URL
              value: {{ include "cerin.backendUrl" . }}
            - name: CERIN_BACKEND_URL
              value: {{ include "cerin.backendUrl" . }}
            - name: CERIN_PUBLIC_BACKEND_URL
              value: {{ include "cerin.backendUrl" . }}
            # Optional: without both, email sign-in is off and `cerin-admin` issues codes.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: RESEND_API_KEY
                  optional: true
            - name: CERIN_EMAIL_FROM
              value: {{ .Values.email.from | quote }}
            # Optional: without both, sign-in offers no Google button.
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ .Values.google.clientId | quote }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: GOOGLE_OAUTH_CLIENT_SECRET
                  optional: true
            # Optional: without issuer, client id and secret, sign-in offers no OIDC button.
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_DISPLAY_NAME
              value: {{ .Values.oidc.name | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: ATLAS_REDIS_ENABLED
              value: 'false'
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: STORAGE_SECRET_KEY
            - name: CERIN_FILE_TRANSFER_S3_BUCKET
              value: cerin-file-transfers
            - name: CERIN_FILE_TRANSFER_S3_REGION
              value: us-east-1
            - name: CERIN_FILE_TRANSFER_S3_ENDPOINT
              value: {{ $storageUrl }}
            - name: CERIN_FILE_TRANSFER_S3_ACCESS_KEY_ID
              value: {{ .Values.storage.accessKey | quote }}
            - name: CERIN_FILE_TRANSFER_S3_SECRET_ACCESS_KEY
              value: $(STORAGE_SECRET_KEY)
            - name: ATLAS_SKILLS_BUCKET
              value: cerin-skills
            - name: ATLAS_SKILLS_S3_REGION
              value: us-east-1
            - name: ATLAS_SKILLS_S3_ENDPOINT
              value: {{ $storageUrl }}
            - name: ATLAS_SKILLS_S3_ACCESS_KEY_ID
              value: {{ .Values.storage.accessKey | quote }}
            - name: ATLAS_SKILLS_S3_SECRET_ACCESS_KEY
              value: $(STORAGE_SECRET_KEY)
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
