<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Cerin</title>
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('../fonts/space-grotesk-latin-variable.woff2') format('woff2');
        font-weight: 300 700;
        font-display: swap;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { mountLogoIntro } from './logo-intro.js'
      const finish = () => parent.postMessage('nuphos:introFinished', '*')
      try {
        const response = await fetch('./cerin.json')
        const brand = await response.json()
        const light = new URLSearchParams(location.search).get('theme') === 'light'
        brand.theme.background = light ? '#F7F7F8' : '#0E0E10'
        brand.theme.ink = light ? '#0E0E10' : '#F7F7F8'
        document.body.style.background = brand.theme.background
        brand.lockIn.at = 1.0
        mountLogoIntro(document.getElementById('stage'), brand, {
          scale: 0.65,
          reducedMotion: 'skip',
          skippable: true,
          onFinish: finish,
        })
      } catch {
        finish()
      }
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') finish()
      })
    </script>
  </body>
</html>
